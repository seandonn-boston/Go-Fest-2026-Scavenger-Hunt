# Deploys the app to GitHub Pages by publishing the repo to the gh-pages
# branch (creating that branch auto-enables Pages — no repo-settings step
# and no admin token needed, unlike the actions/deploy-pages flow).
# The app is plain static files, so the whole repo is the site.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/pokemon-go-scavenger-hunt-n6lx8b, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          force_orphan: true # keep gh-pages as a single deploy commit
