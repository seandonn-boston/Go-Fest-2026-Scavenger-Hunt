# Deploys the app to GitHub Pages. The app is plain static files with no
# build step, so the whole repo is uploaded as the site artifact.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/pokemon-go-scavenger-hunt-n6lx8b, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight production deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true # auto-enable Pages with the Actions source on first run
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
